<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cesta Casa</title>
<meta name="theme-color" content="#EDE6DE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cesta Casa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
/* Estilo iOS con tarjetas de cristal sobre un fondo cálido desenfocado. Acento azul. */
:root{
  --bg:#EDE6DE; --blob1:#F2B27A; --blob2:#A9C49A; --blob3:#D9A47C; --blob4:#F5E6CF;
  --glass:rgba(255,255,255,.66); --glass-strong:rgba(255,255,255,.86); --glass-line:rgba(255,255,255,.75);
  --ink:#1C1C1E; --ink2:#3A3A3C; --muted:#6C6C72; --sep:rgba(60,60,67,.14); --fill:rgba(118,118,128,.12);
  --accent:#2F6BFF; --accent2:#4C83FF; --accent-ink:#FFFFFF; --accent-soft:rgba(47,107,255,.12);
  --red:#FF3B30; --red-soft:rgba(255,59,48,.10); --red-card:rgba(255,236,236,.78);
  --green:#1F9D55; --green-soft:rgba(52,199,89,.16); --orange:#C26A00; --orange-soft:rgba(255,149,0,.16);
  --star:#FFB800; --shadow:0 8px 28px rgba(80,50,20,.12); --shadow-btn:0 10px 24px rgba(47,107,255,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14110E; --blob1:#5A3418; --blob2:#22361F; --blob3:#4A2E1E; --blob4:#2A2219;
  --glass:rgba(38,36,34,.62); --glass-strong:rgba(44,42,40,.92); --glass-line:rgba(255,255,255,.08);
  --ink:#F2F2F7; --ink2:#D1D1D6; --muted:#A1A1A8; --sep:rgba(255,255,255,.10); --fill:rgba(118,118,128,.24);
  --accent:#4C83FF; --accent2:#6B98FF; --accent-ink:#FFFFFF; --accent-soft:rgba(76,131,255,.20);
  --red:#FF6961; --red-soft:rgba(255,105,97,.16); --red-card:rgba(90,30,30,.55);
  --green:#4CD27E; --green-soft:rgba(76,210,126,.18); --orange:#FFB340; --orange-soft:rgba(255,179,64,.18);
  --shadow:0 8px 28px rgba(0,0,0,.4); --shadow-btn:0 10px 24px rgba(47,107,255,.35); color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.35 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.bgfx{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(60px) saturate(120%);
  background:radial-gradient(38% 32% at 12% 18%,var(--blob1),transparent 70%),radial-gradient(34% 30% at 88% 12%,var(--blob2),transparent 70%),
  radial-gradient(40% 36% at 80% 78%,var(--blob3),transparent 70%),radial-gradient(44% 40% at 20% 85%,var(--blob4),transparent 70%),var(--bg)}
#root{position:relative;z-index:1;min-height:100%}
.screen{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(160px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.hdr{display:flex;align-items:center;gap:10px;min-height:52px}
.hdr h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.1}
.hdr .sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.hdr .grow{flex:1;min-width:0}
.hdr.center h1{font-size:18px;font-weight:600;text-align:center}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.round svg{width:20px;height:20px}
.round.blue{color:var(--accent)}
.back{background:none;border:0;padding:6px;margin-left:-6px;display:grid;place-items:center;color:var(--ink)}
.back svg{width:24px;height:24px}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:20px;backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.sec{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:6px 2px -4px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec a,.link{color:var(--accent);font-size:15px;font-weight:500;background:none;border:0;padding:0;text-decoration:none}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:16px;min-height:50px;padding:12px 18px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.btn svg{width:20px;height:20px}
.btn.pri{background:linear-gradient(180deg,var(--accent2),var(--accent));color:var(--accent-ink);box-shadow:var(--shadow-btn)}
.btn.gl{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--ink);box-shadow:var(--shadow)}
.btn.red{background:var(--red-soft);color:var(--red)}
.btn.sm{min-height:38px;padding:8px 14px;font-size:14.5px;border-radius:12px;width:auto}
.btn:disabled{opacity:.55}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:14px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:11px;padding:9px 6px;font-weight:500;font-size:14.5px;color:var(--ink2)}
.seg button.on{background:var(--glass-strong);color:var(--accent);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:44px;border-radius:14px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;padding:10px 0;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;padding:7px 14px;font-size:14.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--glass-strong);box-shadow:inset 0 0 0 1px var(--accent)}
.chip .cnt{background:var(--red);color:#fff;border-radius:999px;font-size:12px;font-weight:700;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.chip select{appearance:none;-webkit-appearance:none;border:0;background:none;font-weight:500;font-size:14.5px;padding-right:2px;outline:none}
.hab{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;padding:10px 4px 8px;border-radius:16px;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:12px;font-weight:500;text-align:center;line-height:1.15;position:relative}
.hab .e{font-size:26px;line-height:1}
.hab .n{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.hab.in{border-color:var(--accent);background:var(--accent-soft)}
.hab.in::after{content:"✓";position:absolute;top:4px;right:6px;color:var(--accent);font-weight:800;font-size:12px}
/* listas */
.grp{overflow:hidden}
.grp-h{display:flex;align-items:center;gap:12px;padding:12px 16px;background:none;border:0;width:100%;text-align:left}
.grp-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none}
.grp-h b{font-size:16.5px;font-weight:650;display:block}
.grp-h .tiny{color:var(--muted)}
.chev{width:20px;height:20px;color:var(--muted);transition:transform .2s}
.grp.closed .chev{transform:rotate(180deg)}
.grp.closed .rows{display:none}
.it{display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--sep);min-height:58px}
.radio{width:26px;height:26px;border-radius:50%;border:1.6px solid var(--muted);background:var(--glass-strong);flex:none;display:grid;place-items:center;padding:0;color:#fff}
.radio.on{background:var(--accent);border-color:var(--accent)}
.radio svg{width:15px;height:15px}
.th{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:26px;flex:none;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.th.lg{width:56px;height:56px;border-radius:14px;font-size:34px;background:var(--glass-strong)}
img.zoom{cursor:zoom-in}
.hero-foto{position:relative;margin:0 0 4px;border-radius:18px;overflow:hidden;background:#fff;display:grid;place-items:center}
.hero-foto img{width:100%;max-height:300px;object-fit:contain;display:block}
.hero-lupa{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:grid;place-items:center;font-size:18px;pointer-events:none}
.lightbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 12px max(16px,env(safe-area-inset-bottom));animation:fadeIn .15s}
.lightbox img{max-width:100%;max-height:82vh;object-fit:contain;border-radius:12px}
.lb-pie{color:#fff;font-size:17px;font-weight:600;margin-top:14px;text-align:center}
.lb-x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.it .body{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}
.it .nm{font-weight:550;font-size:16px;overflow-wrap:anywhere}
.it.done .nm{color:var(--muted);text-decoration:line-through}
.it .mt{font-size:13px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.it .mt.red{color:var(--red)}
.pr{font-size:14px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;border:2px solid var(--glass-strong)}
.av.sm{width:22px;height:22px;font-size:10.5px;border-width:1.5px}
.av.lg{width:44px;height:44px;font-size:18px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--fill);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green)} .pill.warn{background:var(--orange-soft);color:var(--orange)} .pill.bad{background:var(--red-soft);color:var(--red)} .pill.blue{background:var(--accent-soft);color:var(--accent)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--green);background:var(--green-soft);border-radius:999px;padding:3px 10px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.live.off{color:var(--muted);background:var(--fill)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:2px 6px;color:var(--muted);font-size:14px}
.total b{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
/* plan semanal */
.wk{padding:12px}
.wk-nav{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px;font-weight:500;font-size:15px}
.wk-nav button{background:none;border:0;padding:6px;color:var(--ink);display:grid;place-items:center}
.wk-nav svg{width:20px;height:20px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dy{border:0;background:none;border-radius:13px;padding:7px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;color:var(--ink2);position:relative}
.dy b{font-size:15px;font-weight:600;color:var(--muted)}
.dy.on{background:linear-gradient(180deg,var(--accent2),var(--accent));color:#fff;box-shadow:var(--shadow-btn)}
.dy.on b{color:#fff}
.dy.hoy:not(.on) b{color:var(--accent)}
.dy .dots{display:flex;gap:2px;height:4px}
.dy .dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
.mom{font-size:19px;font-weight:700;margin:4px 2px -6px}
.meal{display:flex;align-items:center;gap:14px;padding:10px;min-height:96px}
.meal .tile{width:104px;height:76px;border-radius:14px;display:grid;place-items:center;font-size:44px;flex:none;background:linear-gradient(135deg,var(--blob4),var(--blob1))}
.meal .t{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.meal .t b{font-size:16.5px;font-weight:600;display:block}
.meal .t span{font-size:14px;color:var(--muted)}
.dots3{width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);display:grid;place-items:center;color:var(--ink2);flex:none}
.dots3 svg{width:18px;height:18px}
.meal.empty{border-style:dashed;border-width:1.5px;border-color:var(--muted);background:transparent;box-shadow:none;justify-content:center;color:var(--muted);min-height:64px;font-weight:500;width:100%}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px}
.alert .ic{font-size:26px}
.alert b{display:block;font-size:15px}
/* despensa */
.stp{display:flex;align-items:center;gap:6px;flex:none}.stp button{width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);font-size:21px;font-weight:600;color:var(--accent);display:grid;place-items:center;line-height:1}.stp b{min-width:24px;text-align:center;font-size:17px}
.stp.big button{width:52px;height:52px;font-size:28px}.stp.big input{width:96px;text-align:center;font-size:26px;font-weight:700;padding:8px}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.exp-card{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--red-card);border:1px solid var(--glass-line);width:100%;text-align:left}
.exp-card .nm{font-weight:600}
.exp-card .mt{font-size:13.5px;color:var(--muted)}
.exp-card .mt em{color:var(--red);font-style:normal}
.chev-r{width:18px;height:18px;color:var(--muted);flex:none}
.cards-h{display:flex;gap:12px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;padding-block:2px 6px;scrollbar-width:none}
.cards-h::-webkit-scrollbar{display:none}
.rc{flex:none;width:168px;overflow:hidden;padding:0;text-align:left;border:1px solid var(--glass-line)}
.rc .ph{height:96px;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,var(--blob1),var(--blob3))}
.rc .ti{padding:8px 10px 10px}
.rc .ti b{font-size:14.5px;font-weight:600;display:block;line-height:1.2}
.rc .ti span{font-size:12.5px;color:var(--muted)}
/* precios */
.prod-h{display:flex;align-items:center;gap:14px;padding:16px 16px 10px}
.prod-h .big{font-size:62px;line-height:1}
.prod-h h2{margin:0;font-size:22px;font-weight:700}
.star-btn{margin-left:auto;width:40px;height:40px;border-radius:50%;border:0;background:var(--glass-strong);display:grid;place-items:center;font-size:20px;color:var(--muted);box-shadow:var(--shadow)}
.star-btn.on{color:var(--star)}
.chart{width:100%;height:auto;display:block}
.sup{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--sep)}
.sup:first-child{border-top:0}
.logo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none;letter-spacing:-.02em}
.stars{display:inline-flex}
.stars button{border:0;background:none;padding:0 1px;font-size:15px;line-height:1;color:var(--sep)}
.stars button.on{color:var(--star)}
.up{color:var(--red)} .down{color:var(--green)}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px);background:var(--glass-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-top:1px solid var(--sep)}
.tabbar .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;font-size:11px;font-weight:500;color:var(--muted);position:relative}
.tabbar svg{width:25px;height:25px}
.tabbar button.on{color:var(--accent)}
.tabbar .bd{position:absolute;top:3px;left:calc(50% + 7px);background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}
.fab{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;justify-content:center;padding:0 16px 10px;pointer-events:none}
.fab .btn{max-width:528px;pointer-events:auto}
/* sheets */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center;animation:fi .18s ease}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--glass-strong);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:su .24s cubic-bezier(.2,.9,.3,1)}
.sheet>*{flex-shrink:0}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--sep);margin:2px auto 4px;flex:none}
.sheet h2{margin:0;font-size:21px;font-weight:700}
@keyframes su{from{transform:translateY(40px);opacity:.4}} @keyframes fi{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.ov,.sheet{animation:none}}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:13px;font-weight:600;color:var(--muted);padding-left:2px}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--sep);background:var(--glass-strong);border-radius:12px;padding:11px 12px;min-height:46px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.list-plain{border-radius:16px;overflow:hidden}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--sep);background:none;width:100%;text-align:left;font-size:16px}
.opt:first-child{border-top:0}
.opt svg{width:20px;height:20px;color:var(--muted)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;max-height:320px;overflow:auto;border-radius:16px;background:var(--glass-strong);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.sugg .opt{padding:9px 14px;font-size:15.5px}
.sugg .opt .e{font-size:22px;width:28px;text-align:center}
.tline{display:grid;grid-template-columns:24px 1fr 84px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--sep)}
.tline .inp{min-height:38px;padding:7px 9px;font-size:15px}
.toasts{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top,0px));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 12px;pointer-events:none}
.toast{pointer-events:auto;max-width:540px;width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--glass-strong);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--glass-line);box-shadow:0 12px 34px rgba(0,0,0,.18);animation:td .25s ease}
.toast b{display:block;font-size:15px}
.toast .tiny{color:var(--muted)}
.toast a,.toast .act{color:var(--accent);font-weight:600;background:none;border:0;padding:0;white-space:nowrap;text-decoration:none;font-size:15px}
@keyframes td{from{transform:translateY(-16px);opacity:0}}
.empty{text-align:center;padding:26px 18px;color:var(--muted)}
.empty .e{font-size:40px}
.empty h3{color:var(--ink);margin:6px 0 4px;font-size:18px}
.empty p{margin:0;font-size:14.5px}
.spin{width:18px;height:18px;border:2.2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.stat{padding:12px 14px}
.stat .tiny{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.code{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:.18em}
video.scan{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;font-size:14px}
.welcome{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.welcome .glass{width:100%;max-width:440px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.logo-app{width:64px;height:64px;border-radius:16px;overflow:hidden;flex:none;box-shadow:0 10px 24px rgba(14,124,107,.35)}
.logo-app img{width:100%;height:100%;display:block}
.part{display:contents}
.it.sw-ok{position:relative;overflow:hidden}
.it .del{position:absolute;right:0;top:0;bottom:0;width:96px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:15px;transform:translateX(100%);transition:transform .18s ease}
.it.sw .del{transform:none}
@media (prefers-reduced-motion:reduce){.it .del{transition:none}}
.meal .tile img,.rc .ph img,.th img{width:100%;height:100%;object-fit:cover;display:block}
.meal .tile,.rc .ph{overflow:hidden}
.rc .ph{display:grid;place-items:center}
.ptab-wrap{overflow-x:auto;padding:0}
.ptab{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.ptab th{font-size:11.5px;font-weight:600;color:var(--muted);padding:10px 4px 8px;vertical-align:bottom}
.ptab th .logo{margin:0 auto 3px;width:26px;height:26px;font-size:11px}
.ptab th span{display:block}
.ptab td{border-top:1px solid var(--sep);padding:3px 2px;text-align:center}
.ptab th:first-child,.ptab td:first-child{position:sticky;left:0;z-index:1;background:var(--glass-strong);text-align:left;min-width:128px;max-width:150px;padding-left:10px}
.ptab .pn{border:0;background:none;padding:6px 0;text-align:left;font-weight:550;font-size:14px;line-height:1.2;width:100%}
.ptab td button:not(.pn){border:0;background:none;min-width:70px;width:100%;padding:6px 2px;border-radius:10px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;gap:1px}
.ptab td button small{font-size:10.5px;font-weight:400;color:var(--muted)}
.ptab td button.min{background:var(--green-soft);color:var(--green)}
.ptab td button.vac{color:var(--muted);font-weight:400;font-size:18px}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (max-width:370px){.meal .tile{width:84px;height:64px;font-size:36px}.hdr h1{font-size:26px}}
</style>

const pendNoti=[];let notiT;
function onRemote(t,type,nw,old){const arr=S.t[t];if(!arr)return;
  if(type==='DELETE'){const i=arr.findIndex(x=>x.id===old.id);if(i>=0){arr.splice(i,1);paint()}return}
  if(!nw)return;const i=arr.findIndex(x=>x.id===nw.id);const prev=i>=0?arr[i]:null;if(i>=0)arr[i]=nw;else arr.push(nw);
  if(t==='miembros'&&nw.user_id===S.user?.id)S.me=nw;
  const otro=id=>id&&S.me&&id!==S.me.id;
  if(t==='lista'&&type==='INSERT'&&otro(nw.por))notify(nw.por,`${quien(nw.por)} ha añadido ${nw.nombre}`,'a la lista de la compra');
  if(t==='lista'&&type==='UPDATE'&&nw.comprado&&!(prev&&prev.comprado)&&otro(nw.comprado_por))notify(nw.comprado_por,`${quien(nw.comprado_por)} ha marcado ${nw.nombre}`,[nw.marca,nw.super].filter(Boolean).join(' · ')||'ahora');
  if(t==='eventos'&&type==='INSERT'&&nw.tipo==='comprado'&&otro(nw.por)){pendNoti.push(nw);clearTimeout(notiT);notiT=setTimeout(flushCompra,1800)}
  paint()}
function flushCompra(){const ev=pendNoti.splice(0);if(!ev.length)return;const p=ev[0].por;
  const txt=ev.slice(0,4).map(e=>e.nombre+(e.marca?` (${e.marca})`:'')).join(', ')+(ev.length>4?` y ${ev.length-4} más`:'');
  notify(p,`${quien(p)} ha comprado ${ev.length} ${ev.length===1?'producto':'productos'}`,txt+(ev[0].super?` · ${ev[0].super}`:''),true)}
function notify(por,title,body,sys){toastHtml(`${avatar(por)}<div class="grow"><b>${esc(title)}</b><span class="tiny">${esc(body)}</span></div>`,5000);
  if((sys||document.hidden)&&'Notification'in window&&Notification.permission==='granted'&&navigator.serviceWorker){navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icon-192.png',tag:'cesta'})).catch(()=>{})}}

function asegurarTiendas(rows){if(!S.t.tiendas)return;const ya=new Set(SUP().map(norm));const nuevas=[];

  if(nuevas.length)ins('tiendas',nuevas)}
async function ins(t,rows){rows=[].concat(rows).map(r=>({id:uuid(),hogar_id:S.hogar.id,created_at:nowIso(),...r}));if(t!=='tiendas'&&rows.some(r=>r.super))asegurarTiendas(rows);S.t[t].push(...rows);paint();
  try{await B.insert(t,rows)}catch(e){fallo(e,t)}return rows}
async function upd(t,id,p){if(t!=='tiendas'&&p&&p.super)asegurarTiendas([p]);const r=S.t[t].find(x=>x.id===id);if(r)Object.assign(r,p);paint();try{await B.update(t,id,p)}catch(e){fallo(e,t)}}
async function rem(t,ids){ids=[].concat(ids);S.t[t]=S.t[t].filter(x=>!ids.includes(x.id));paint();try{for(const id of ids)await B.remove(t,id)}catch(e){fallo(e,t)}}

/* Proporción de un precio: kg, l, ud (huevos, rollos…), lavado o m. Misma lógica que precios/convertir.py */
const NO_ALIM=['Hogar y bricolaje','Papelería y oficina','Ropa y calzado','Electrónica','Otros'];
const SOLO_CONTAR=['bolsas','bayetas','estropajos','guantes','fregona','pinzas','perchas','velas','vasos','platos','cubiertos','tupper','pilas','pila ','folios','compresas','tampones','pañales','toallitas','pañuelos','tiritas','gasas','bastoncillos','algodón','cuchillas','pastillas lavavajillas','café en cápsulas','infusiones','té','papel higiénico','papel de cocina'];
const BASES=['kg','l','lavado','m','ud'];const BASE_TXT={kg:'kg',l:'l',ud:'ud',lavado:'lavado',m:'m'};
function medidas(texto,cat,nombre){const s=' '+String(texto||'').toLowerCase().replace(/,/g,'.')+' ';const n=String(nombre||'').toLowerCase();const out={};
  const solo=NO_ALIM.includes(cat)||SOLO_CONTAR.some(w=>n.startsWith(w));
  if(!solo){const cv={kg:[1,'kg'],kilo:[1,'kg'],kilos:[1,'kg'],g:[.001,'kg'],gr:[.001,'kg'],grs:[.001,'kg'],l:[1,'l'],lt:[1,'l'],litro:[1,'l'],litros:[1,'l'],ml:[.001,'l'],cl:[.01,'l']};
    const u='(kg|kilos|kilo|grs|gr|g|litros|litro|lt|ml|cl|l)\\b';let m=s.match(new RegExp('(\\d+)\\s*x\\s*(\\d+(?:\\.\\d+)?)\\s*'+u));
    if(m){const[f,b]=cv[m[3]];out[b]=+m[1]*+m[2]*f}else{m=s.match(new RegExp('(\\d+(?:\\.\\d+)?)\\s*'+u));if(m&&+m[1]>0){const[f,b]=cv[m[2]];out[b]=+m[1]*f}}}
  let m=s.match(/(\d+)\s*(lv|lavados?)\b/);if(m)out.lavado=+m[1];
  m=s.match(/(\d+(?:\.\d+)?)\s*(m|metros?)\b/);if(m&&!out.lavado&&+m[1]>0)out.m=+m[1];
  let c=null;if(/\bdocena\b|\b1\s*dc\b/.test(s))c=12;
  const pats=[/(?:pack|set|juego|caja)\s*(?:de\s*)?(\d+)/,/(\d+)\s*x\s*1\s*u\b/,...(solo?[/(\d+)\s*x\s*\d+(?:\.\d+)?\s*(?:l|ml|cl|kg|g|gr)\b/]:[]),/(\d+)\s*(?:ud|uds|u|unidades|unidad|unid|piezas|pzas|bolsitas|c[aá]psulas|rollos|pares|hojas|bolsas|bayetas|estropajos|pastillas|huevos|sobres|maquinillas|unds)\b/];
  for(const p of pats){if(c)break;const x=s.match(p);if(x&&+x[1]>0&&+x[1]<5000)c=+x[1]}if(c)out.ud=c;return out}
function baseProducto(nombre){const r=REF.get(norm(nombre));const b=r&&r.find(x=>x.base);return b?b.base:null}
function ofertas(nombre){const k=norm(nombre);const g={};
  [...S.t.precios.filter(p=>norm(p.nombre)===k&&vigente(p)),...(REF.get(k)||[]),...OFER.filter(o=>norm(o.nombre)===k&&vigente(o))].forEach(p=>{const key=p.super+'|'+(p.marca||'');(g[key]=g[key]||[]).push(p)});
  const offs=Object.entries(g).map(([key,rows])=>{rows.sort((a,b)=>(a.fecha+a.created_at).localeCompare(b.fecha+b.created_at));const last=rows[rows.length-1];if(!(num(last.precio)>0))return null;rows=rows.filter(r=>num(r.precio)>0);
    let prev=null;for(let i=rows.length-2;i>=0;i--)if(num(rows[i].precio)!==num(last.precio)){prev=num(rows[i].precio);break}
    const v=S.t.valoraciones.find(v=>norm(v.nombre)===k&&v.super===last.super&&(v.marca||'')===(last.marca||''));
    const u=last.unidad||'ud';let pu=null,base=null,est=!!last.est;
    if(last.pu&&last.base){pu=num(last.pu);base=last.base}
    else if(u==='kg'||u==='l'){pu=num(last.precio);base=u}
    else{const cat=infoArticulo(nombre).categoria;const md=last.formato?medidas(last.formato,cat,nombre):{};const pb=baseProducto(nombre);
      const b=pb&&md[pb]?pb:BASES.find(x=>md[x]);
      if(b){pu=num(last.precio)/md[b];base=b}
      else{const rr=(REF.get(k)||[]).filter(x=>x.super===last.super&&x.q&&x.base).pop();if(rr){pu=num(last.precio)/rr.q;base=rr.base;est=true}}}
    return {key,super:last.super,marca:last.marca||'',precio:num(last.precio),unidad:u,fecha:last.fecha,prev,hist:rows,calidad:v?v.calidad:3,valId:v&&v.id,
      ref:!!last.ref,oferta:!!last.hasta,hasta:last.hasta||'',antes:last.antes?num(last.antes):null,producto:last.producto||'',formato:last.formato||'',fuente:last.fuente||'',url:last.url||'',nota:last.nota||'',pu,base,est,q:pu?num(last.precio)/pu:null}}).filter(Boolean);
  if(!offs.length)return [];
  const cuenta={};offs.forEach(o=>{if(o.pu)cuenta[o.base]=(cuenta[o.base]||0)+1});
  const pb=baseProducto(nombre);const bp=pb&&cuenta[pb]?pb:BASES.slice().sort((a,b)=>(cuenta[b]||0)-(cuenta[a]||0)||BASES.indexOf(a)-BASES.indexOf(b))[0];
  const comparables=offs.filter(o=>o.pu&&o.base===bp);const ninguno=!offs.some(o=>o.pu);
  const prop=comparables.length>=2||(comparables.length===1&&offs.length===1);
  offs.forEach(o=>{o.comparable=ninguno||(prop&&comparables.includes(o));o.cmp=ninguno?o.precio:(o.comparable?o.pu:(o.pu||Infinity))});
  offs.porKilo=prop;offs.base=prop?bp:null;
  const cand=offs.filter(o=>o.comparable);if(!cand.length){offs.forEach(o=>{o.valor=0;o.barato=false;o.compensa=false});return offs}

      const u=it.unidad||'ud';const peso=o.pu&&o.comparable&&((o.base==='kg'&&(u==='kg'||u==='g'))||(o.base==='l'&&(u==='l'||u==='ml')));
      let coste;if(peso)coste=o.pu*num(it.cantidad||1)/((u==='g'||u==='ml')?1000:1);
      else if(o.pu&&o.comparable&&u==='ud'){const qs=ofertas(it.nombre).filter(x=>x.comparable&&x.q).map(x=>x.q);coste=o.pu*(qs.length?median(qs):o.q)*(num(it.cantidad)||1)}

  const row=fila;

const FOLLETOS=[['Mercadona','https://www.tiendeo.com/Folletos-Catalogos/mercadona'],['Lidl','https://www.lidl.es/c/descubre-nuevas-ofertas-cada-semana-folletos-lidl/s10087402'],['Aldi','https://www.aldi.es/ofertas.html'],['Carrefour','https://www.tiendeo.com/Folletos-Catalogos/carrefour'],['Consum','https://www.tiendeo.com/Folletos-Catalogos/consum'],['Dia','https://www.tiendeo.com/Folletos-Catalogos/dia']];

function tablaPrecios(q){const sups=planCfg().sups;const enL=new Set(S.t.lista.filter(i=>!i.comprado).map(i=>norm(i.nombre)));

function chart(rows){const pts=rows.map(r=>({d:r.fecha,p:num(r.precio)}));if(pts.length<2)return `<div class="small muted" style="padding:6px 16px 4px">Solo hay un precio apuntado (${eur(pts[0].p)} el ${fmtFecha(pts[0].d)}). Con más tickets verás la evolución.</div>`;
  const W=340,H=170,L=46,R=14,T=26,Bm=28;const t0=new Date(pts[0].d+'T12:00')/1,t1=new Date(pts[pts.length-1].d+'T12:00')/1||t0+1;
  const ps=pts.map(x=>x.p);let lo=Math.min(...ps),hi=Math.max(...ps);const step=niceStep((hi-lo)||hi*0.2||1);lo=Math.max(0,Math.floor(lo/step)*step-step);hi=Math.ceil(hi/step)*step+step*0;
  if(hi<=lo)hi=lo+step;const X=t=>L+(t-t0)/((t1-t0)||1)*(W-L-R),Y=p=>T+(1-(p-lo)/(hi-lo))*(H-T-Bm);
  const ticks=[];for(let v=lo;v<=hi+1e-9;v+=step)ticks.push(+v.toFixed(2));
  const xy=pts.map(x=>[X(new Date(x.d+'T12:00')/1),Y(x.p)]);const path=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L${xy[xy.length-1][0].toFixed(1)} ${H-Bm} L${xy[0][0].toFixed(1)} ${H-Bm} Z`;
  const months=[];const d0=new Date(t0);d0.setDate(1);for(let d=new Date(d0);d/1<=t1;d.setMonth(d.getMonth()+1)){if(d/1>=t0-864e5*3)months.push(new Date(d))}
  const mlab=months.length>6?months.filter((_,i)=>i%Math.ceil(months.length/6)===0):months;
  const last=xy[xy.length-1],lp=pts[pts.length-1];const bx=Math.min(Math.max(last[0]-30,L),W-R-60);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del precio">
   <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sep)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v.toFixed(2).replace('.',',')} €</text>`).join('')}
   ${mlab.map(m=>`<text x="${X(Math.max(m/1,t0))}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${m.toLocaleDateString('es-ES',{month:'short'}).replace('.','').replace(/^./,c=>c.toUpperCase())}</text>`).join('')}
   <path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
   ${xy.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.6" fill="var(--glass-strong)" stroke="var(--accent)" stroke-width="2"/>`).join('')}
   <line x1="${last[0]}" x2="${last[0]}" y1="${last[1]}" y2="${H-Bm}" stroke="var(--accent)" stroke-dasharray="3 3" opacity=".6"/>
   <g transform="translate(${bx},${Math.max(2,last[1]-46)})"><rect width="60" height="34" rx="8" fill="var(--accent)"/><text x="30" y="15" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">${lp.p.toFixed(2).replace('.',',')} €</text><text x="30" y="28" text-anchor="middle" font-size="10" fill="#fff" opacity=".9">${fmtFecha(lp.d)}</text></g></svg>`}
function niceStep(r){const raw=r/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}

  if(!n){if(o)o.remove();sel.value='Otro';return}
  if(!o){o=document.createElement('option');o.dataset.custom='1';sel.appendChild(o)}o.value=n;o.textContent=n;sel.value=n});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.ov'))closeSheet();else if(S.addQ){limpiarAdd()}}});
function limpiarAdd(){S.addQ='';const q=$('#qadd');if(q)q.value='';updSugg()}

A.tab=d=>{S.tab=d.k;S.sub=null;S.precioDet=null;S.addQ='';S.addFocus=false;lsSet('cc-tab',d.k);closeSheet();render();window.scrollTo(0,0)};
A.close=closeSheet;
A.dia=d=>{S.day=d.d;paint()};
A.semana=d=>{S.week=addDays(S.week,+d.n);S.day=S.week<=hoy()&&hoy()<=addDays(S.week,6)?hoy():S.week;paint()};
A.listMode=d=>{S.listMode=d.k;paint()};
A.toggleGrp=d=>{S.closed[d.k]=!S.closed[d.k];paint()};
A.despF=d=>{S.despF=d.k;paint()};
A.precioDet=d=>{closeSheet();S.precioDet=d.n;S.precioSup='';S.precioSeg='precio';render();window.scrollTo(0,0)};
A.precioBack=()=>{S.precioDet=null;render()};
A.precioSeg=d=>{S.precioSeg=d.k;paint()};
A.precioVista=d=>{S.precioVista=d.k;lsSet('cc-pvista',d.k);paint()};
A.tablaSup=d=>{const c=planCfg();const sups=c.sups.includes(d.s)?c.sups.filter(x=>x!==d.s):[...c.sups,d.s];lsSet('cc-plan',{...c,sups});paint()};
A.precioSup=d=>{S.precioSup=d.k;paint()};
A.subRecetas=()=>{S.sub='recetas';render();window.scrollTo(0,0)};
A.subActividad=()=>{S.sub='actividad';render();window.scrollTo(0,0)};
A.subBack=()=>{S.sub=null;render()};

/* --- lista --- */
function parseAdd(raw){const m=raw.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|gr|l|ml|ud|uds|x)?\s+(?:de\s+)?(.+)$/i);
  if(!m)return {nombre:raw,cantidad:1,unidad:''};let u=(m[2]||'').toLowerCase();u=u==='gr'?'g':(u==='uds'||u==='x'?'ud':u);return {nombre:m[3],cantidad:num(m[1]),unidad:u}}
A.addTyped=async()=>{const raw=S.addQ.trim();if(!raw)return;const p=parseAdd(raw);const sug=sugerencias(p.nombre,1)[0];
  const nombre=sug&&norm(sug.nombre)===norm(p.nombre)?sug.nombre:p.nombre;limpiarAdd();await añadirConAviso(nombre,p.cantidad,p.unidad)};
A.addSug=async d=>{const p=parseAdd(S.addQ.trim());limpiarAdd();await añadirConAviso(d.n,p.cantidad,p.unidad)};
A.addHab=async d=>{const ya=S.t.lista.find(i=>!i.comprado&&norm(i.nombre)===norm(d.n));if(ya){toast(`${d.n} ya está en la lista`,`<button class="act" data-a="editItem" data-id="${ya.id}">Cambiar</button>`);return}await añadirConAviso(d.n,1,'')};
A.addLista1=async d=>{await añadirConAviso(d.n,1,'')};
const esNuevo=n=>!S.catalogo.some(c=>norm(c.nombre)===norm(n))&&!S.t.articulos.some(a=>norm(a.nombre)===norm(n)&&!borrado(a))&&!fotoProducto({nombre:n});
async function añadirConAviso(n,c,u){const nuevo=esNuevo(n);const r=await addLista(n,{cantidad:c,unidad:u});const casa=enCasa(n);
  const foto=nuevo&&!fotoProducto({nombre:n})?`<button class="act" data-a="fotoArtN" data-n="${esc(cap(n))}">📷 Foto</button>`:'';
  toast(r==='sumado'?`${cap(n)} ya estaba: cantidad sumada`:casa.length?`Apuntado. Ojo: en casa hay ${fmtQty(casa.reduce((a,x)=>a+num(x.cantidad),0),casa[0].unidad)}`:nuevo?`${cap(n)} es nuevo y está en la lista. ¿Le haces una foto?`:`${cap(n)} añadido a la lista`,foto)}
A.fotoArtN=async d=>{const f=await elegirFoto();if(!f)return;let a=S.t.articulos.find(x=>norm(x.nombre)===norm(d.n));
  if(!a){const i=infoArticulo(d.n);[a]=await ins('articulos',{nombre:cap(d.n),categoria:i.categoria||'Otros',emoji:i.emoji||'📦',unidad:i.unidad||'ud',marca:'',ean:'',imagen:'',veces:0,ultima:nowIso(),oculto:false,favorito:false})}
  toast('Subiendo foto…');try{const v=await subirFoto(f);const viejo=a.imagen;await upd('articulos',a.id,{imagen:v});borrarFoto(viejo);toast(`Foto guardada: ${a.nombre}`);
    if(document.querySelector('[data-a=qGuardar]'))A.despCant({n:a.nombre})}catch(e){toast('No se pudo subir la foto: '+(e.message||e))}};
A.check=async d=>{const i=S.t.lista.find(x=>x.id===d.id);if(!i)return;await upd('lista',i.id,i.comprado?{comprado:false,comprado_por:null,comprado_at:null}:{comprado:true,comprado_por:S.me.id,comprado_at:nowIso()})};
A.marcarTodo=async()=>{const p=S.t.lista.filter(i=>!i.comprado);for(const i of p)upd('lista',i.id,{comprado:true,comprado_por:S.me.id,comprado_at:nowIso()})};
A.fotoItem=async d=>{const i=S.t.lista.find(x=>x.id===d.id);if(!i)return;let a=S.t.articulos.find(x=>norm(x.nombre)===norm(i.nombre));if(!a){const inf=infoArticulo(i.nombre);[a]=await ins('articulos',{nombre:cap(i.nombre),categoria:inf.categoria,emoji:inf.emoji,unidad:inf.unidad||'ud',marca:'',ean:'',imagen:'',veces:0,ultima:nowIso(),oculto:false,favorito:false})}if(await cambiarFoto('articulos',a.id,'imagen'))A.editItem(d)};
A.editItem=d=>{const i=S.t.lista.find(x=>x.id===d.id);if(!i)return;const o=ofertas(i.nombre);
  sheet(`${heroFoto(i)}<div class="row">${thumbSiNo(i,'lg')}<div class="grow"><h2>${esc(i.nombre)}</h2><span class="small muted">${esc(i.categoria)} · apuntó ${esc(quien(i.por))}</span></div><button class="btn gl sm" data-a="fotoItem" data-id="${i.id}" aria-label="Poner foto">${svg('camera')}</button></div>
  ${o.length?`<div class="glass list-plain">${[...o].sort((a,b)=>b.valor-a.valor).map(x=>`<button class="opt" data-a="pickOffer" data-s="${esc(x.super)}" data-m="${esc(x.marca)}" data-p="${x.precio}">${logo(x.super)}<span class="grow">${esc(x.super)}${x.marca?' · '+esc(x.marca):''}<span class="tiny muted" style="display:block">${'★'.repeat(x.calidad)}${x.compensa?' · compensa':''}${x.barato?' · más barato':''}</span></span><span class="pr">${eur(x.precio)}</span></button>`).join('')}</div>`:''}
  <div class="g2"><div class="fld"><label for="e-c">Cantidad</label><input class="inp" id="e-c" type="number" inputmode="decimal" step="any" value="${esc(i.cantidad)}"></div><div class="fld"><label for="e-u">Unidad</label><select class="inp" id="e-u">${selOpts(UNIDADES,i.unidad)}</select></div></div>
  <div class="g2"><div class="fld"><label for="e-s">Súper</label><select class="inp" id="e-s">${selOpts(SUP(),i.super,'Cualquiera')}</select></div><div class="fld"><label for="e-m">Marca</label><input class="inp" id="e-m" value="${esc(i.marca)}" placeholder="Hacendado…"></div></div>
  <div class="g2"><div class="fld"><label for="e-p">Precio (€)</label><input class="inp" id="e-p" type="number" inputmode="decimal" step="0.01" value="${num(i.precio)||''}" placeholder="${precioDe(i)?String(precioDe(i)).replace('.',','):'0,00'}"></div><div class="fld"><label for="e-cat">Pasillo</label><select class="inp" id="e-cat">${selOpts(S.cats.map(c=>c.nombre),i.categoria)}</select></div></div>
  <div class="fld"><label for="e-n">Nota</label><input class="inp" id="e-n" value="${esc(i.nota)}" placeholder="Talla, tamaño, para quién…"></div>
  <div class="row"><button class="btn red sm" data-a="delItem" data-id="${i.id}">Quitar</button><span class="grow"></span><button class="btn gl sm" data-a="close">Cancelar</button><button class="btn pri sm" data-a="saveItem" data-id="${i.id}">Guardar</button></div>`)};
A.pickOffer=d=>{$('#e-s').value=d.s;$('#e-m').value=d.m;$('#e-p').value=d.p};
A.saveItem=async d=>{const v=id=>$('#'+id).value;const cat=v('e-cat');const i=S.t.lista.find(x=>x.id===d.id);
  await upd('lista',d.id,{cantidad:num(v('e-c'))||1,unidad:v('e-u'),super:v('e-s'),marca:v('e-m').trim(),precio:num(v('e-p')),categoria:cat,nota:v('e-n').trim()});
  const a=i&&S.t.articulos.find(x=>norm(x.nombre)===norm(i.nombre));if(a&&a.categoria!==cat)upd('articulos',a.id,{categoria:cat});closeSheet()};
A.delItem=async d=>{closeSheet();await quitarDeLista([d.id])};
A.quitarItem=async d=>{await quitarDeLista([d.id])};
let QUITADOS=[];
async function quitarDeLista(ids){const rows=S.t.lista.filter(i=>ids.includes(i.id));if(!rows.length)return;QUITADOS=rows.map(r=>({...r}));await rem('lista',ids);
  toast(rows.length===1?`Quitado de la lista: ${rows[0].nombre}`:`${rows.length} productos quitados de la lista`,`<button class="act" data-a="deshacerQuitar">Deshacer</button>`)}
A.deshacerQuitar=async()=>{const r=QUITADOS;QUITADOS=[];if(!r.length)return;await ins('lista',r.map(({id,hogar_id,...x})=>x));toast('Recuperado')};
A.editLista=()=>{S.editLista=!S.editLista;paint()};
A.vaciarLista=()=>sheet(`<h2>¿Vaciar la lista?</h2><p class="small muted" style="margin:0">Se quitan todos los productos pendientes. Podrás deshacerlo justo después.</p><div class="row"><span class="grow"></span><button class="btn gl sm" data-a="close">Cancelar</button><button class="btn red sm" data-a="okVaciarLista">Vaciar</button></div>`);
A.okVaciarLista=async()=>{closeSheet();S.editLista=false;await quitarDeLista(S.t.lista.filter(i=>!i.comprado).map(i=>i.id))};
/* deslizar a la izquierda para quitar */
let swX=null,swY=null,swEl=null;
document.addEventListener('touchstart',e=>{const it=e.target.closest('.it.sw-ok');document.querySelectorAll('.it.sw').forEach(x=>{if(x!==it)x.classList.remove('sw')});if(!it){swEl=null;return}swEl=it;swX=e.touches[0].clientX;swY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(!swEl)return;const t=e.changedTouches[0];const dx=t.clientX-swX,dy=t.clientY-swY;if(Math.abs(dy)<35){if(dx<-45)swEl.classList.add('sw');else if(dx>35)swEl.classList.remove('sw')}swEl=null},{passive:true});
A.compraMenu=()=>sheet(`<h2>Lista de la compra</h2><div class="glass list-plain">
  <button class="opt" data-a="ticket">${svg('camera')}<span class="grow">Importar ticket</span></button>
  <button class="opt" data-a="whatsLista">${svg('whats')}<span class="grow">Enviar la lista por WhatsApp</span></button>
  <button class="opt" data-a="habituales">${svg('basket')}<span class="grow">Mis artículos</span></button>
  <button class="opt" data-a="vaciarComprados">${svg('trash')}<span class="grow">Quitar los marcados sin guardar</span></button>
  <button class="opt" data-a="vaciarLista" style="color:var(--red)">${svg('trash')}<span class="grow">Vaciar la lista</span></button></div><button class="btn gl" data-a="close">Cerrar</button>`);
A.vaciarComprados=async()=>{const ids=S.t.lista.filter(i=>i.comprado).map(i=>i.id);closeSheet();if(!ids.length){toast('No hay nada marcado.');return}await quitarDeLista(ids)};
A.whatsLista=()=>{const p=S.t.lista.filter(i=>!i.comprado);const g={};p.forEach(i=>(g[i.categoria]=g[i.categoria]||[]).push(i));
  const txt='🛒 Lista de la compra\n'+Object.keys(g).sort((a,b)=>catOrden(a)-catOrden(b)).map(k=>`\n${catMeta(k).emoji} ${k}\n`+g[k].map(i=>`• ${i.nombre} (${fmtQty(i.cantidad,i.unidad)})${i.marca?' '+i.marca:''}`).join('\n')).join('\n');
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');closeSheet()};

/* --- habituales / mis artículos --- */
A.habituales=()=>{closeSheet();habSheet('')};
function habListHtml(q){const k=norm(q);const v=S.habVista||'mios';const inL=n=>S.t.lista.some(i=>!i.comprado&&norm(i.nombre)===norm(n));const bs=borradosSet();
  if(v==='borrados'){const arr=S.t.articulos.filter(a=>borrado(a)&&(!k||norm(a.nombre).includes(k))).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
    if(!arr.length)return '<div class="empty"><p>No hay artículos borrados.</p></div>';
    return `<div class="glass list-plain" style="margin-top:8px">${arr.map(a=>`<div class="opt" style="padding:8px 12px">${thumb(a)}<span class="grow" style="opacity:.6">${esc(a.nombre)}</span><button class="btn gl sm" data-a="recArt" data-n="${esc(a.nombre)}">Recuperar</button></div>`).join('')}</div>`}
  let arr=S.t.articulos.filter(a=>!borrado(a)&&(!k||norm(a.nombre).includes(k)));
  if(v==='todos'){const mios=new Set(arr.map(a=>norm(a.nombre)).concat(S.t.articulos.map(a=>norm(a.nombre))));
    arr=arr.concat(S.catalogo.filter(c=>!mios.has(norm(c.nombre))&&!bs.has(norm(c.nombre))&&(!k||norm(c.nombre).includes(k))).map(c=>({...c,veces:null,cat:true})))}
  arr.sort((a,b)=>catOrden(a.categoria)-catOrden(b.categoria)||(num(b.veces)-num(a.veces))||a.nombre.localeCompare(b.nombre,'es'));
  const g={};arr.forEach(a=>(g[a.categoria]=g[a.categoria]||[]).push(a));
  return Object.keys(g).map(c=>`<div class="small muted" style="margin:10px 2px 4px;font-weight:600">${esc(catMeta(c).emoji)} ${esc(c)}</div><div class="glass list-plain">${g[c].map(a=>`<div class="opt" style="padding:8px 12px">${thumb(a)}<button class="body grow" style="background:none;border:0;text-align:left;padding:0" data-a="habAdd" data-n="${esc(a.nombre)}"><span style="${a.oculto?'opacity:.5':''}">${esc(a.nombre)}</span><span class="tiny muted" style="display:block">${a.cat?'Del catálogo':`${a.veces} ${a.veces===1?'vez':'veces'}`}${a.marca?' · '+esc(a.marca):''}${a.oculto?' · oculto':''}</span>${a.descripcion?`<span class="tiny muted" style="display:block;white-space:normal">${esc(a.descripcion)}</span>`:''}</button>${inL(a.nombre)?'<span class="pill blue">En lista</span>':''}<button class="dots3" data-a="editArtN" data-n="${esc(a.nombre)}" aria-label="Editar ${esc(a.nombre)}">${svg('dots')}</button><button class="dots3" data-a="delArt" data-n="${esc(a.nombre)}" aria-label="Borrar ${esc(a.nombre)}" style="color:var(--red)">${svg('trash')}</button></div>`).join('')}</div>`).join('')||`<div class="empty"><p>${k?'No hay artículos con ese nombre.':'Todavía no hay artículos. Se guardan solos al añadirlos a la lista.'}</p></div>`}
function habSegHtml(){const v=S.habVista||'mios';const nb=S.t.articulos.filter(borrado).length;return [['mios','Míos'],['todos','Todos'],['borrados','Borrados'+(nb?` (${nb})`:'')]].map(([kk,t])=>`<button class="${v===kk?'on':''}" data-a="habVista" data-k="${kk}">${t}</button>`).join('')}
function habRefresh(){const l=document.getElementById('habl');if(!l)return;l.innerHTML=habListHtml(S.habQ||'');const sg=document.getElementById('habseg');if(sg)sg.innerHTML=habSegHtml()}
function habSheet(q){S.habQ=q||'';const o=sheet(`<h2>Mis artículos</h2><p class="small muted" style="margin:0">Toca un artículo para añadirlo a la lista. Con la papelera lo borras: deja de salir en sugerencias, habituales y precios. En «Todos» están también los del catálogo, y en «Borrados» puedes recuperarlos.</p>
   <button class="btn pri" data-a="nuevoArt">${svg('plus')}Nuevo artículo</button>
   <div class="seg" id="habseg">${habSegHtml()}</div>
   <label class="search" style="background:var(--fill)">${svg('search')}<input id="habq" type="search" placeholder="Buscar" value="${esc(S.habQ)}"></label><div id="habl">${habListHtml(S.habQ)}</div><button class="btn gl" data-a="close">Cerrar</button>`);
  o.querySelector('#habq').addEventListener('input',e=>{S.habQ=e.target.value;o.querySelector('#habl').innerHTML=habListHtml(e.target.value)})}
A.habVista=d=>{S.habVista=d.k;habRefresh()};
A.delArt=async(d,b)=>{if(b.dataset.ok!=='1'){b.dataset.ok='1';b.style.width='auto';b.style.padding='0 10px';b.style.borderRadius='17px';b.innerHTML='<span class="small" style="font-weight:600">¿Borrar?</span>';setTimeout(()=>{if(b.isConnected&&b.dataset.ok==='1'){b.dataset.ok='';b.removeAttribute('style');b.style.color='var(--red)';b.innerHTML=svg('trash')}},4000);return}
  await borrarNombre(d.n);toast(`Borrado: ${d.n}`,`<button class="act" data-a="recArt" data-n="${esc(d.n)}">Deshacer</button>`);habRefresh()};
A.recArt=async d=>{await recuperarNombre(d.n);toast(`Recuperado: ${d.n}`);habRefresh()};
A.habAdd=async(d,b)=>{await addLista(d.n,{cantidad:1});const pill=b.parentElement.querySelector('.pill');if(!pill)b.insertAdjacentHTML('afterend','<span class="pill blue">En lista</span>');toast(`${d.n} añadido`)};
A.editArtN=async d=>{let a=S.t.articulos.find(x=>norm(x.nombre)===norm(d.n));
  if(!a){const i=infoArticulo(d.n);[a]=await ins('articulos',{nombre:cap(d.n),categoria:i.categoria||'Otros',emoji:i.emoji||'📦',unidad:i.unidad||'ud',marca:'',ean:'',imagen:'',veces:0,ultima:nowIso(),oculto:false,favorito:false})}
  A.editArt({id:a.id})};
function preciosArtHtml(n){const o=ofertas(n);return `<div class="fld"><label>Precios</label><div class="glass list-plain">${o.length?[...o].sort((x,y)=>x.precio-y.precio).map(x=>`<button class="opt" data-a="celda" data-n="${esc(n)}" data-s="${esc(x.super)}" data-back="art" style="padding:8px 12px;width:100%;text-align:left">${logo(x.super)}<span class="grow"><b style="font-weight:550">${esc(x.super)}</b>${x.oferta?' <span class="pill bad">🏷️ Oferta</span>':''}<span class="tiny muted" style="display:block">${esc([x.marca,x.formato,x.fecha?fmtFecha(x.fecha):''].filter(Boolean).join(' · '))}</span></span><span class="pr">${eur(x.precio)}</span><span class="small" style="color:var(--accent);margin-left:8px">Cambiar</span></button>`).join(''):'<div class="small muted" style="padding:10px 12px">Sin precios todavía.</div>'}</div>
  <button class="btn gl sm" data-a="celdaNueva" data-n="${esc(n)}" data-back="art" style="margin-top:8px">${svg('plus')}Precio en otro súper o tienda</button></div>`}
A.editArt=d=>{const a=S.t.articulos.find(x=>x.id===d.id);if(!a)return;S.editArtId=a.id;
  sheet(`${heroFoto(a)}<div class="row">${thumbSiNo(a,'lg')}<h2 class="grow">Editar artículo</h2><button class="btn gl sm" data-a="fotoArt" data-id="${a.id}">${svg('camera')}Foto</button></div><div class="g2"><div class="fld"><label for="a-n">Nombre</label><input class="inp" id="a-n" value="${esc(a.nombre)}"></div><div class="fld"><label for="a-e">Emoji</label><input class="inp" id="a-e" value="${esc(a.emoji)}" maxlength="4"></div></div>
  <div class="fld"><label for="a-c">Pasillo o tipo</label><select class="inp" id="a-c">${selOpts(S.cats.map(c=>c.nombre),a.categoria)}</select></div>
  <div class="g2"><div class="fld"><label for="a-m">Marca preferida</label><input class="inp" id="a-m" value="${esc(a.marca)}"></div><div class="fld"><label for="a-u">Unidad</label><select class="inp" id="a-u">${selOpts(UNIDADES,a.unidad)}</select></div></div>
  <div class="fld"><label for="a-d">Descripción</label><textarea class="inp" id="a-d" rows="3" placeholder="Ej. El de tapón azul, sin lactosa…">${esc(a.descripcion||'')}</textarea></div>
  ${preciosArtHtml(a.nombre)}

function frescura(d){const n=diasHasta(d.caduca);

  if(age<lim-1)return {txt:age>=1?`Desde hace ${age} ${age===1?'día':'días'}`:'',nivel:0};

function pluralNombre(s){const w=String(s).trim().split(' ');const pl=x=>{const l=x.toLowerCase();if(/s$/.test(l)||/y$/.test(l))return x;if(/[aeiouáéó]$/.test(l))return x+'s';if(/z$/.test(l))return x.slice(0,-1)+'ces';
    const m={'ín':'ines','ón':'ones','án':'anes','én':'enes'};for(const k in m)if(l.endsWith(k))return x.slice(0,-2)+m[k];return x+'es'};
  if(/s$/i.test(w[0]))return s;w[0]=pl(w[0]);if(w[1]&&/[oa]$/i.test(w[1]))w[1]=pl(w[1]);return w.join(' ')}
function envase(nombre,cat){const n=norm(nombre);cat=cat||infoArticulo(nombre).categoria;
  if(/^huevo/.test(n))return ['huevo','huevos'];
  if(/^(yogur|petit|natillas|flan|kefir)/.test(n))return ['unidad','unidades'];
  if(/^(leche|bebida de|zumo|caldo|nata|horchata)/.test(n))return ['brick','bricks'];
  if(/^(cerveza|refresco|tonica|bebida isotonica)/.test(n))return ['lata','latas'];
  if(/^(aceite|vinagre|vino|cava|agua|lejia|friegasuelos|suavizante|limpiacristales|multiusos)/.test(n))return ['botella','botellas'];
  if(/tomate (frito|triturado)|salsa|ketchup|mayonesa|mostaza|alioli|pesto|mermelada|^miel|crema de cacao|cacao|cafe soluble|colorante|pimenton|oregano|comino|curry|pimienta|azafran|laurel/.test(n))return ['bote','botes'];
  if(cat==='Conservas')return /esparrago|pimiento|alcachofa|aceituna|pepinillo|melocoton|pate/.test(n)?['tarro','tarros']:['lata','latas'];
  if(cat==='Frutas y verduras')return /s$/.test(n.split(' ')[0])||/^(ensalada|perejil|cilantro|albahaca)/.test(n)?['bolsa','bolsas']:[String(nombre).toLowerCase(),pluralNombre(nombre).toLowerCase()];

/* --- escáner de códigos de barras --- */
/* un artículo puede tener varios códigos: ean = "código|marca|súper,código|marca|súper" */
const codigos=a=>String(a&&a.ean||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>{const [c,m,su]=x.split('|');return {c:(c||'').replace(/\D/g,''),m:m||'',s:su||''}}).filter(x=>x.c);
const codigosTxt=l=>l.map(x=>[x.c,(x.m||'').replace(/[|,]/g,' '),(x.s||'').replace(/[|,]/g,' ')].join('|').replace(/\|+$/,'')).join(',');
const artPorCodigo=code=>S.t.articulos.find(a=>!borrado(a)&&codigos(a).some(x=>x.c===code));
async function asociarCodigo(art,code,marca,sup){for(const o of S.t.articulos.filter(a=>a.id!==art.id&&codigos(a).some(x=>x.c===code)))await upd('articulos',o.id,{ean:codigosTxt(codigos(o).filter(x=>x.c!==code))});
  const l=codigos(art).filter(x=>x.c!==code);l.push({c:code,m:marca||'',s:sup||''});await upd('articulos',art.id,{ean:codigosTxt(l)})}
const FRESCAS=new Set(['Frutas y verduras','Carnes y pescados']);/* lo que tiene código de barras suele ser envasado */
function adivinarArticulo(nom){const k=norm(nom);if(!k)return '';const kw=k.split(' ')[0];const bs=borradosSet();let best='',bp=0;
  const punt=n=>{if(k===n)return 1000;if(k.startsWith(n+' '))return 500+n.length;const nw=n.split(' ')[0];if(nw===kw&&nw.length>=4)return 300+(k.includes(n)?50:0)+n.split(' ').slice(1).filter(w=>w.length>2&&k.includes(w)).length*10;if(k.includes(' '+n+' ')||k.endsWith(' '+n))return 100+n.length;return 0};
  for(const a of S.t.articulos.filter(a=>!borrado(a))){const p=punt(norm(a.nombre))+(num(a.veces)>0?5:0)-(FRESCAS.has(a.categoria)?40:0);if(p>bp){bp=p;best=a.nombre}}
  for(const c of S.catalogo){const n=norm(c.nombre);if(bs.has(n))continue;const p=punt(n)-(FRESCAS.has(c.categoria)?40:0);if(p>bp){bp=p;best=c.nombre}}
  return bp>=100?best:''}
let scanStream=null,scanCtl=null,scanLoop=0;
function stopScan(){cancelAnimationFrame(scanLoop);scanLoop=0;try{scanCtl&&scanCtl.stop()}catch(e){}scanCtl=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
A.scan=async d=>{const destino=d.p||'despensa';
  sheet(`<h2>Escanear código de barras</h2><video class="scan" id="scanv" playsinline muted></video><p class="small muted" id="scanmsg" style="margin:0">Apunta al código de barras del producto.</p>
   <form class="row" data-f="eanManual"><input class="inp" id="eanin" inputmode="numeric" placeholder="O escribe el número"><button class="btn gl sm" type="submit">Buscar</button></form>
   <button class="btn gl" data-a="close">Cancelar</button>`);
  S.scanDest=destino;const v=$('#scanv');
  try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('sin cámara');
    if('BarcodeDetector'in window){scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=scanStream;await v.play();
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      const tick=async()=>{if(!scanStream)return;try{const c=await det.detect(v);if(c[0]){onEAN(c[0].rawValue);return}}catch(e){}scanLoop=requestAnimationFrame(tick)};tick()}
    else{if(!window.ZXingBrowser)await loadScript('https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js');
      if(!$('#scanv'))return;const r=new ZXingBrowser.BrowserMultiFormatReader();
      scanCtl=await r.decodeFromConstraints({video:{facingMode:'environment'}},$('#scanv'),(res)=>{if(res){onEAN(res.getText())}})}}
  catch(e){const m=$('#scanmsg');if(m)m.textContent='No se pudo abrir la cámara. Da permiso a la cámara o escribe el número del código.'}};
A.eanManual=()=>{const v=$('#eanin').value.replace(/\D/g,'');if(v.length>=8)onEAN(v);else toast('El código tiene 8 o 13 números.')};
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.appendChild(s)})}
async function onEAN(code){stopScan();if(navigator.vibrate)navigator.vibrate(60);busy('Buscando el producto…');
  const a=artPorCodigo(code);
  if(a&&S.scanDest==='despensa'){const e=codigos(a).find(x=>x.c===code)||{};S.despFlujo=true;S.eanPend=null;toast(`Es ${a.nombre}${e.m?' ('+e.m+')':''}`);A.despCant({n:a.nombre});return}
  if(a){const e=codigos(a).find(x=>x.c===code)||{};abrirEscaneado({nombre:a.nombre,marca:e.m||a.marca,super:e.s||'',imagen:a.imagen,ean:code,unidad:a.unidad,conocido:true});toast(`Es ${a.nombre}${e.m?' ('+e.m+')':''}`);return}
  let p=null;try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_es,brands,image_front_small_url,quantity`);const j=await r.json();if(j.status===1)p=j.product}catch(e){}
  if(S.scanDest==='despensa'){const nom=p?cap(p.product_name_es||p.product_name||''):'';const guess=adivinarArticulo(nom);S.despFlujo=true;
    S.eanPend={code,marca:p?(p.brands||'').split(',')[0].trim():'',imagen:p&&p.image_front_small_url||'',off:nom};
    if(guess){A.despCant({n:guess});return}A.addDesp({q:nom.split(' ').slice(0,2).join(' '),aviso:nom?`Código nuevo: «${nom}». Elige qué producto es y lo recordaré.`:'No conozco este código. Busca el producto y lo recordaré para la próxima vez.'});return}
  if(p){const nom=cap(p.product_name_es||p.product_name||'');const guess=adivinarArticulo(nom);
    abrirEscaneado({nombre:guess||nom,marca:(p.brands||'').split(',')[0].trim(),imagen:p.image_front_small_url||'',ean:code,offNombre:nom})}
  else{abrirEscaneado({nombre:'',ean:code});toast('No conozco ese código. Escribe el nombre y la próxima vez lo recordaré.')}}

  <div class="g2"><button class="btn gl" data-a="editReceta" data-id="${r.id}">Editar</button><button class="btn gl" data-a="faltaReceta" data-id="${r.id}">${svg('cart')}Lo que falta</button></div>`)};
A.fotoReceta=async d=>{if(await cambiarFoto('recetas',d.id,'imagen'))A.verReceta(d)};
A.faltaReceta=d=>{const r=S.t.recetas.find(x=>x.id===d.id);if(!r)return;const filas=(r.ingredientes||[]).map(i=>({i,e:estadoIng(i)}));
  const falta=filas.filter(f=>(f.e.tipo==='falta'||f.e.tipo==='poco'));const tiene=filas.filter(f=>f.e.tipo==='ok'||f.e.tipo==='hay');
  const fila=f=>{const [c,u]=f.e.tipo==='poco'?deBase(f.e.falta,f.e.b):[num(f.i.cant)||1,f.i.unidad||'ud'];const cc=+c.toFixed(2);
    return `<label class="opt" style="padding:9px 14px;gap:10px"><input type="checkbox" class="falta-chk" data-n="${esc(f.i.nombre)}" data-c="${cc}" data-u="${u}" ${f.e.enL?'':'checked'} style="width:22px;height:22px">${thumb({nombre:f.i.nombre})}<span class="grow">${esc(f.i.nombre)}<span class="tiny muted" style="display:block">${f.e.tipo==='poco'?`Necesitas ${fmtQty(f.i.cant,f.i.unidad)}, tenéis ${esc(hayTxt(f.e.st))}: faltan <b>${fmtQty(cc,u)}</b>`:`Necesitas ${fmtQty(f.i.cant,f.i.unidad)}, no hay en la despensa`}${f.e.enL?' · ya está en la lista':''}</span></span></label>`};
  sheet(`<h2>${esc(r.emoji||'')} ${esc(r.nombre)}</h2><p class="small muted" style="margin:0">Comparado con lo que hay en la despensa. Marca lo que quieres apuntar.</p>
   ${falta.length?`<div class="sec" style="margin:4px 0 0">Te falta</div><div class="glass list-plain">${falta.map(fila).join('')}</div>`:'<div class="glass pad"><b>✅ Tenéis todo para esta receta.</b></div>'}
   ${tiene.length?`<div class="sec" style="margin:4px 0 0">Ya tenéis</div><div class="glass list-plain">${tiene.map(f=>`<div class="opt" style="padding:9px 14px">${thumb({nombre:f.i.nombre})}<span class="grow">${esc(f.i.nombre)}<span class="tiny muted" style="display:block">Necesitas ${fmtQty(f.i.cant,f.i.unidad)} · tenéis ${esc(hayTxt(f.e.st))}${f.e.tipo==='hay'?' (comprueba que llega)':''}</span></span><span class="pill ok">En casa</span></div>`).join('')}</div>`:''}
   <div class="row"><button class="btn gl sm" data-a="close">Cerrar</button><span class="grow"></span>${falta.length?`<button class="btn pri sm" data-a="faltaApuntar" data-r="${esc(r.nombre)}">${svg('cart')}Apuntar en la lista</button>`:''}</div>`)};
A.faltaApuntar=async d=>{const ch=[...document.querySelectorAll('.falta-chk:checked')];let n=0;
  for(const c of ch){const nombre=c.dataset.n;if(S.t.lista.some(x=>!x.comprado&&norm(x.nombre)===norm(nombre)))continue;await addLista(nombre,{cantidad:num(c.dataset.c)||1,unidad:c.dataset.u||'ud',receta:d.r});n++}
  closeSheet();toast(n?`${n} ${n===1?'ingrediente apuntado':'ingredientes apuntados'} en la lista`:'No se ha apuntado nada',n?`<button class="act" data-a="tab" data-k="compra">Ver lista</button>`:'')};
/* cocinar: descuenta de la despensa */
A.cocinar=d=>{const r=S.t.recetas.find(x=>x.id===d.id);if(!r)return;
  const rows=(r.ingredientes||[]).map((i,k)=>{const e=estadoIng(i);
    if(e.tipo==='ok'||e.tipo==='poco'){const queda=e.tipo==='ok'?e.hay-aBase(num(i.cant)||1,i.unidad).q:0;
      return `<div class="opt" style="padding:9px 14px">${thumb({nombre:i.nombre})}<span class="grow">${esc(i.nombre)}<span class="tiny muted" style="display:block">Se resta ${e.tipo==='poco'?'todo lo que hay ('+esc(hayTxt(e.st))+')':fmtQty(i.cant,i.unidad)} · ${queda>1e-6?'quedarán '+qtyBase(queda,e.b):'<b>se acaba</b>'}</span></span></div>`}
    if(e.tipo==='hay')return `<label class="opt" style="padding:9px 14px;gap:10px">${thumb({nombre:i.nombre})}<span class="grow">${esc(i.nombre)}<span class="tiny muted" style="display:block">Tenéis ${esc(hayTxt(e.st))}; la receta usa ${fmtQty(i.cant,i.unidad)}</span></span><span class="small">¿Se acabó?</span><input type="checkbox" class="cocina-chk" data-k="${k}" style="width:22px;height:22px"></label>`;
    return `<div class="opt" style="padding:9px 14px;opacity:.6">${thumb({nombre:i.nombre})}<span class="grow">${esc(i.nombre)}<span class="tiny muted" style="display:block">No estaba en la despensa</span></span></div>`}).join('');
  sheet(`<h2>🍳 ${esc(r.nombre)}</h2><p class="small muted" style="margin:0">Esto es lo que se va a quitar de la despensa. Lo que se acabe queda en la Actividad y te ofrezco apuntarlo en la lista.</p>
   <div class="glass list-plain">${rows||'<div class="opt muted">La receta no tiene ingredientes.</div>'}</div>
   <div class="row"><button class="btn gl sm" data-a="close">Cancelar</button><span class="grow"></span><button class="btn pri sm" data-a="cocinarOk" data-id="${r.id}">Restar de la despensa</button></div>`)};
async function gastarDespensa(nombre,q,b){const items=enCasa(nombre).filter(d=>aBase(1,d.unidad).b===b).sort((x,y)=>String(x.caduca||'9999').localeCompare(String(y.caduca||'9999')));const acabados=[];
  for(const d of items){if(q<=1e-6)break;const x=aBase(num(d.cantidad)||1,d.unidad);const usa=Math.min(q,x.q);q-=usa;const resto=x.q-usa;
    if(resto<=1e-6){await ins('eventos',{tipo:'consumido',nombre:d.nombre,emoji:d.emoji,super:d.super,marca:d.marca,precio:num(d.precio),cantidad:num(d.cantidad),unidad:d.unidad,por:S.me.id});await rem('despensa',d.id);acabados.push(d)}
    else await upd('despensa',d.id,{cantidad:+(resto/x.f).toFixed(3)})}return acabados}
A.cocinarOk=async d=>{const r=S.t.recetas.find(x=>x.id===d.id);if(!r)return;const marcados=new Set([...document.querySelectorAll('.cocina-chk:checked')].map(c=>+c.dataset.k));let n=0;const acab=new Set();
  for(const [k,i] of (r.ingredientes||[]).entries()){const e=estadoIng(i);
    if(e.tipo==='ok'||e.tipo==='poco'){const nb=aBase(num(i.cant)||1,i.unidad);const a=await gastarDespensa(i.nombre,nb.q,nb.b);if(!enCasa(i.nombre).length&&a.length)acab.add(i.nombre);n++}
    else if(e.tipo==='hay'&&marcados.has(k)){for(const x of [...e.st.items]){await ins('eventos',{tipo:'consumido',nombre:x.nombre,emoji:x.emoji,super:x.super,marca:x.marca,precio:num(x.precio),cantidad:num(x.cantidad),unidad:x.unidad,por:S.me.id});await rem('despensa',x.id)}acab.add(i.nombre);n++}}
  closeSheet();const l=[...acab].filter(x=>!S.t.lista.some(i=>!i.comprado&&norm(i.nombre)===norm(x)));
  toast(`Despensa actualizada (${n} ${n===1?'ingrediente':'ingredientes'})${l.length?'. Se acabó: '+l.join(', '):''}`,l.length?`<button class="act" data-a="reponerVarios" data-n="${esc(l.join('|'))}">Apuntar en la lista</button>`:'')};
A.reponerVarios=async d=>{const l=String(d.n||'').split('|').filter(Boolean);for(const n of l)await addLista(n,{});toast(`${l.length} ${l.length===1?'apuntado':'apuntados'} en la lista`)};
const ingTxt=r=>(r.ingredientes||[]).map(i=>`${String(i.cant).replace('.',',')} ${i.unidad&&i.unidad!=='ud'?i.unidad+' ':''}${i.nombre}`).join('\n');
function parseIng(t){return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const p=parseAdd(l);const info=infoArticulo(p.nombre);return {nombre:sugerencias(p.nombre,1)[0]&&norm(sugerencias(p.nombre,1)[0].nombre)===norm(p.nombre)?sugerencias(p.nombre,1)[0].nombre:cap(p.nombre),cant:p.cantidad||1,unidad:p.unidad||info.unidad||'ud'}})}
A.editReceta=d=>{const r=S.t.recetas.find(x=>x.id===d.id)||{};
  sheet(`<h2>${r.id?'Editar receta':'Nueva receta'}</h2><div class="row"><div class="fld" style="width:70px"><label for="r-e">Emoji</label><input class="inp" id="r-e" value="${esc(r.emoji||'🍽️')}" maxlength="4" style="text-align:center"></div><div class="fld grow"><label for="r-n">Nombre</label><input class="inp" id="r-n" value="${esc(r.nombre)}" ${r.id?'':'autofocus'} placeholder="Macarrones con tomate"></div></div>

  sheet(`<div class="glass list-plain"><button class="opt" data-a="verReceta" data-id="${ex.receta_id}">${svg('book')}<span class="grow">Ver receta</span></button><button class="opt" data-a="elegirReceta" data-m="${d.m}">${svg('cal')}<span class="grow">Cambiar</span></button><button class="opt" data-a="faltaReceta" data-id="${ex.receta_id}">${svg('cart')}<span class="grow">Añadir lo que falta a la lista</span></button><button class="opt" data-a="cocinar" data-id="${ex.receta_id}"><span style="font-size:20px">🍳</span><span class="grow">La he cocinado: restar de la despensa</span></button><button class="opt" data-a="quitarMeal" data-id="${ex.id}" style="color:var(--red)">${svg('trash')}<span class="grow">Quitar del plan</span></button></div><button class="btn gl" data-a="close">Cancelar</button>`)};

A.genLista=async()=>{const desde=S.week<hoy()?hoy():S.week,hasta=addDays(S.week,6);const need={};
  S.t.menu.filter(m=>m.fecha>=desde&&m.fecha<=hasta).forEach(m=>{const r=S.t.recetas.find(x=>x.id===m.receta_id);if(!r)return;
    (r.ingredientes||[]).forEach(i=>{const x=aBase(num(i.cant)||1,i.unidad);const k=norm(i.nombre)+'|'+x.b;need[k]=need[k]||{nombre:i.nombre,b:x.b,q:0,rec:[]};need[k].q+=x.q;if(!need[k].rec.includes(r.nombre))need[k].rec.push(r.nombre)})});
  const items=Object.values(need);if(!items.length){toast('Elige primero recetas en el plan de esta semana.');return}
  let add=0,ok=0,ya=0;for(const it of items){const e=estadoNecesidad(it.nombre,it.q,it.b);
    if(e.tipo==='ok'||e.tipo==='hay'){ok++;continue}if(e.enL){ya++;continue}
    const [c,u]=deBase(e.falta,it.b);await addLista(it.nombre,{cantidad:+c.toFixed(2),unidad:u,receta:it.rec.join(', '),sinTocar:false});add++}
  toast(`${add} añadidos · ${ok} ya los tenéis${ya?` · ${ya} ya estaban`:''}`,`<button class="act" data-a="tab" data-k="compra">Ver lista</button>`)};

const PROMPT_TICKET=`Saca los productos de este ticket de compra. Responde SOLO con este formato, sin explicaciones ni tablas:

SUPER: nombre del supermercado
FECHA: AAAA-MM-DD
Producto; Marca; Cantidad; Unidad; Tamaño; Importe

Reglas:
- Una línea por producto, separando los campos con punto y coma.
- Producto: nombre normal en español, sin abreviaturas (Tomate frito, no TOM.FRITO).
- Marca: si se deduce (Hacendado, Deliplus, Bosque Verde…); si no, déjala vacía.
- Cantidad y Unidad: ud, kg o l. En productos al peso pon los kg.
- Tamaño: el tamaño del envase si aparece o se deduce (400 g, 1 l, 6 x 1 l, 12 ud). Si no se sabe, déjalo vacío.
- Importe: lo pagado por esa línea, con coma decimal (1,90).
- No incluyas IVA, subtotales, total, bolsas ni forma de pago. Si hay un descuento, réstalo del producto.`;
const EJEMPLO_TICKET=`SUPER: Mercadona
FECHA: ${hoy()}
Tomate frito; Hacendado; 2; ud; 560 g; 1,90
Plátano; ; 1,2; kg; ; 2,34
Folios; ; 1; ud; 500 hojas; 4,50`;
A.ticket=()=>{closeSheet();sheet(`<h2>Importar ticket</h2>
  <p class="small muted" style="margin:0">1. Copia las instrucciones y pégalas en la IA que uses (ChatGPT, Claude, Gemini…) junto con la foto del ticket.<br>2. Copia lo que te responda y pégalo aquí.</p>
  <button class="btn gl" data-a="copiarPrompt">Copiar instrucciones para la IA</button>
  <div class="fld"><label for="tk-txt">Texto del ticket</label><textarea class="inp" id="tk-txt" rows="9" placeholder="${esc(EJEMPLO_TICKET)}" style="font-family:var(--mono);font-size:14px"></textarea></div>
  <details class="small muted"><summary>Ver el formato</summary><pre style="white-space:pre-wrap;font-size:12.5px;margin:8px 0 0">${esc(EJEMPLO_TICKET)}</pre><p style="margin:6px 0 0">También vale solo <b>Producto; Importe</b>, separar con tabulador (copiado de una hoja de cálculo) o el formato JSON.</p></details>
  <button class="btn pri" data-a="leerTexto">Revisar</button><button class="btn gl" data-a="close">Cancelar</button>`)};
A.copiarPrompt=async(d,b)=>{try{await navigator.clipboard.writeText(PROMPT_TICKET);b.textContent='Copiado ✓'}catch(e){sheet(`<h2>Instrucciones para la IA</h2><p class="small muted" style="margin:0">Mantén pulsado para copiar.</p><textarea class="inp" rows="14" readonly>${esc(PROMPT_TICKET)}</textarea><button class="btn gl" data-a="ticket">Volver</button>`)}};
A.leerTexto=()=>{const r=parseTicket($('#tk-txt').value);if(!r.lineas.length){toast('No he encontrado productos. Revisa que cada línea tenga el importe al final.');return}revisarTicket(r)};
function fechaISO(t){t=String(t||'').trim();let m=t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=t.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return ''}
function superDe(t){const k=norm(t);return SUP().find(s=>k.includes(norm(s)))||(t?cap(t):'')}
function parseTicket(txt){txt=String(txt||'').replace(/```[a-z]*\n?|```/gi,'').trim();const r={super:'',fecha:'',lineas:[]};
  if(/^[\[{]/.test(txt)){try{const j=JSON.parse(txt);const L=Array.isArray(j)?j:(j.lineas||j.productos||[]);r.super=superDe(j.super||j.supermercado||'');r.fecha=fechaISO(j.fecha||'');
    r.lineas=L.map(l=>({nombre:cap(l.nombre||l.producto||''),marca:l.marca||'',cantidad:num(l.cantidad)||1,unidad:['kg','l'].includes(l.unidad)?l.unidad:'ud',importe:num(l.importe??l.precio)})).filter(l=>l.nombre&&l.importe>0);return r}catch(e){}}
  for(let line of txt.split(/\r?\n/)){line=line.replace(/^\s*[-*•·]\s*/,'').replace(/\|/g,';').trim();if(!line)continue;
    const kv=line.match(/^(super(?:mercado)?|tienda|fecha|total)\s*[:=]\s*(.*)$/i);
    if(kv){const k=norm(kv[1]);if(k.startsWith('super')||k==='tienda')r.super=superDe(kv[2]);else if(k==='fecha')r.fecha=fechaISO(kv[2]);continue}
    const c=line.split(/[;\t]/).map(x=>x.trim());while(c.length&&c[c.length-1]==='')c.pop();
    if(c.length<2||/^producto$/i.test(c[0]))continue;
    const imp=num(String(c[c.length-1]).replace(/[€\s]/g,''));if(!(imp>0)||!c[0])continue;
    let l={nombre:cap(c[0]),marca:'',cantidad:1,unidad:'ud',importe:imp};
    if(c.length===3)l.cantidad=num(c[1])||1;
    if(c.length===4){l.marca=c[1];l.cantidad=num(c[2])||1}
    if(c.length>=5){l.marca=c[1];l.cantidad=num(c[2])||1;const u=norm(c[3]);l.unidad=u.startsWith('k')?'kg':(u==='l'||u.startsWith('lit'))?'l':'ud'}
    if(c.length>=6)l.formato=c[4];
    r.lineas.push(l)}
  return r}
let TK=null;
function revisarTicket(r){TK=r;const sup=SUP().includes(r.super)?r.super:(r.super?'Otro':'Mercadona');const suma=r.lineas.reduce((a,l)=>a+num(l.importe),0);
  sheet(`<h2>Revisar ticket</h2><div class="total" style="padding:0"><span>${r.lineas.length} productos</span><b>${eur(suma)}</b></div>
  <p class="small muted" style="margin:0">Lo marcado va a la despensa (comida, limpieza, higiene). Lo que estaba en la lista se tacha solo. Los precios se guardan siempre.</p>
  <div class="g2"><div class="fld"><label for="tk-s">Súper</label><select class="inp" id="tk-s">${selOpts(SUP(),sup)}</select></div><div class="fld"><label for="tk-f">Fecha</label><input class="inp" id="tk-f" type="date" value="${esc(r.fecha||hoy())}"></div></div>
  <div>${r.lineas.map((l,i)=>{const info=infoArticulo(l.nombre);const nombre=norm(info.nombre)===norm(l.nombre)?info.nombre:l.nombre;const enL=S.t.lista.some(x=>!x.comprado&&norm(x.nombre)===norm(nombre));
    return `<div class="tline"><input type="checkbox" id="tk-c${i}" ${catMeta(info.categoria).va_a_despensa?'checked':''} aria-label="Guardar en despensa"><div><input class="inp" id="tk-n${i}" value="${esc(nombre)}" aria-label="Nombre"><span class="tiny muted">${esc(info.emoji)} ${esc(info.categoria)}${l.marca?' · '+esc(l.marca):''}${num(l.cantidad)!==1||l.unidad!=='ud'?` · ${fmtQty(l.cantidad,l.unidad)}`:''}${enL?' · <span style="color:var(--accent)">en la lista</span>':''}</span></div><input class="inp" id="tk-p${i}" type="number" step="0.01" inputmode="decimal" value="${num(l.importe).toFixed(2)}" aria-label="Importe"></div>`}).join('')}</div>
  <button class="btn pri" data-a="aplicarTicket">Guardar ticket</button><button class="btn gl" data-a="ticket">Volver</button>`)}
A.aplicarTicket=async()=>{if(!TK)return;const b=$('[data-a=aplicarTicket]');b.disabled=true;b.innerHTML='<span class="spin"></span> Guardando';
  const sup=$('#tk-s').value,fecha=$('#tk-f').value||hoy();const precs=[],desp=[],evs=[],quitar=[];
  TK.lineas.forEach((l,i)=>{const nombre=cap($('#tk-n'+i).value);if(!nombre)return;const imp=num($('#tk-p'+i).value);const info=infoArticulo(nombre);
    const cat=info.categoria;const cant=num(l.cantidad)||1,uni=['kg','l'].includes(l.unidad)?l.unidad:'ud';
    const pu=imp/cant;
    precs.push({nombre,super:sup,marca:l.marca||'',precio:+pu.toFixed(2),unidad:uni,fecha,por:S.me.id,...(l.formato?{formato:l.formato}:{})});
    const li=S.t.lista.find(x=>norm(x.nombre)===norm(nombre)&&!quitar.includes(x.id));if(li)quitar.push(li.id);
    if($('#tk-c'+i).checked)desp.push({nombre,emoji:info.emoji,categoria:cat,cantidad:cant,unidad:uni,caduca:null,super:sup,marca:l.marca||'',precio:imp,por:S.me.id});
    evs.push({tipo:'comprado',nombre,emoji:info.emoji,super:sup,marca:l.marca||'',precio:imp,cantidad:cant,unidad:uni,por:S.me.id});
    tocarArticulo({nombre,categoria:cat,emoji:info.emoji,unidad:uni},l.marca?{marca:l.marca}:null)});
  await ins('precios',precs);if(desp.length)await ins('despensa',desp);await ins('eventos',evs);if(quitar.length)await rem('lista',quitar);
  TK=null;closeSheet();toast(`Ticket guardado · ${desp.length} a la despensa${quitar.length?` · ${quitar.length} tachados`:''}`,`<a href="${waLink(evs)}" target="_blank" rel="noopener">WhatsApp</a>`)};
