A.pickColor=(d,b)=>{S._color=d.c;document.querySelectorAll('[data-a=pickColor]').forEach(x=>x.style.outline='');b.style.outline='3px solid var(--ink)';b.style.outlineOffset='2px'};
A.saveNombre=async()=>{const n=cap($('#cn-n').value)||S.me.nombre;await upd('miembros',S.me.id,{nombre:n,color:S._color||S.me.color});S.me=S.t.miembros.find(m=>m.id===S.me.id)||S.me;closeSheet()};
A.demoSoy=d=>{lsSet('cc-demo-me',d.id);S.me=S.t.miembros.find(m=>m.id===d.id);closeSheet();paint()};
A.notis=async()=>{if(!('Notification'in window)){toast('Este navegador no permite avisos. En iPhone, instala la app en la pantalla de inicio primero.');return}
  const p=await Notification.requestPermission();toast(p==='granted'?'Avisos activados mientras la app esté abierta o en segundo plano':'Avisos no permitidos')};
A.instalar=()=>sheet(`<h2>Instalar en el móvil</h2><div class="small" style="display:grid;gap:10px"><div><b>iPhone (Safari):</b> botón Compartir → «Añadir a pantalla de inicio».</div><div><b>Android (Chrome):</b> menú ⋮ → «Instalar aplicación» o «Añadir a pantalla de inicio».</div><div class="muted">Se abre a pantalla completa como una app normal.</div></div><button class="btn gl" data-a="close">Entendido</button>`);
A.logout=async()=>{closeSheet();if(S.sb)await S.sb.auth.signOut();location.reload()};
A.irSetup=()=>{closeSheet();lsSet('cc-mode','');renderSetup()};

/* ============ PANTALLAS DE ENTRADA ============ */
function welcome(inner){$('#root').innerHTML=`<div class="welcome"><div class="glass">${inner}</div></div>`}
function renderSetup(){const c=getConfig()||{};
  welcome(`<div class="logo-app"><img src="icon-192.png" alt=""></div><div><h1 style="margin:0;font-size:28px">Cesta Casa</h1><p class="muted" style="margin:4px 0 0">Lista de la compra, despensa, menús y precios de toda la familia.</p></div>
   <form data-f="saveConfig" style="display:grid;gap:10px"><div class="fld"><label for="cf-u">URL del proyecto Supabase</label><input class="inp" id="cf-u" placeholder="https://xxxx.supabase.co" value="${esc(c.url||'')}" autocomplete="off"></div>
   <div class="fld"><label for="cf-k">Clave pública (anon / publishable)</label><input class="inp" id="cf-k" placeholder="eyJhbGciOi… o sb_publishable_…" value="${esc(c.key||'')}" autocomplete="off"></div>
   <button class="btn pri" type="submit">Conectar</button></form>
   <button class="btn gl" data-a="demo">Probar con datos de ejemplo</button>`)}
A.saveConfig=()=>{const url=$('#cf-u').value.trim().replace(/\/$/,''),key=$('#cf-k').value.trim();if(!/^https:\/\/.+/.test(url)||key.length<20){toast('Revisa la URL y la clave.');return}lsSet('cc-config',{url,key});lsSet('cc-mode','supa');location.reload()};
A.demo=()=>{lsSet('cc-mode','demo');location.reload()};
function renderLogin(msg,modo,email){modo=modo||(lsGet('cc-ya-cuenta','')?'entrar':'inicio');const em=esc(email||'');
  const cab=(t,sub)=>`<div class="logo-app"><img src="icon-192.png" alt=""></div><div><h1 style="margin:0;font-size:26px">${t}</h1><p class="muted small" style="margin:4px 0 0">${sub}</p></div>${msg?`<div class="small" style="color:var(--accent);font-weight:600">${esc(msg)}</div>`:''}`;
  const proyecto=CONFIG&&CONFIG.supabaseUrl?'':`<button class="link small" data-a="irSetup" style="align-self:center">Cambiar de proyecto</button>`;
  const ver=`<label class="row small" style="gap:8px"><input type="checkbox" class="ver-pass"> Mostrar contraseña</label>`;
  if(modo==='inicio'){welcome(`${cab('Bienvenido a Cesta Casa','La lista de la compra, la despensa y los precios, compartidos con tu familia.')}
    <button class="btn pri" data-a="modoLogin" data-k="crear" style="min-height:58px;font-size:17px">Es mi primera vez: crear cuenta</button>
    <button class="btn gl" data-a="modoLogin" data-k="entrar" style="min-height:58px;font-size:17px">Ya tengo cuenta: entrar</button>${proyecto}`);return}
  if(modo==='crear'){welcome(`${cab('Crear cuenta','Cada persona de la casa usa su propia cuenta. Solo hace falta un correo y una contraseña.')}
    <form data-f="signup" style="display:grid;gap:10px">
     <div class="fld"><label for="lg-e">Tu correo</label><input class="inp" id="lg-e" type="email" autocomplete="email" inputmode="email" autocapitalize="off" required value="${em}"></div>
     <div class="fld"><label for="lg-p">Inventa una contraseña</label><input class="inp" id="lg-p" type="password" autocomplete="new-password" minlength="6" required><span class="tiny muted">Mínimo 6 letras o números. Apúntala para no olvidarla.</span></div>
     <div class="fld"><label for="lg-p2">Repite la contraseña</label><input class="inp" id="lg-p2" type="password" autocomplete="new-password" minlength="6" required></div>
     ${ver}<button class="btn pri" type="submit" style="min-height:54px;font-size:17px">Crear mi cuenta</button></form>
    <div style="border-top:1px solid var(--sep);padding-top:12px;text-align:center" class="small muted">¿Ya tenías cuenta? <button class="link small" data-a="modoLogin" data-k="entrar">Entrar aquí</button></div>`);return}
  welcome(`${cab('Entrar','Escribe el correo y la contraseña de tu cuenta.')}
   <form data-f="login" style="display:grid;gap:10px"><div class="fld"><label for="lg-e">Correo</label><input class="inp" id="lg-e" type="email" autocomplete="email" inputmode="email" autocapitalize="off" required value="${em}"></div><div class="fld"><label for="lg-p">Contraseña</label><input class="inp" id="lg-p" type="password" autocomplete="current-password" minlength="6" required></div>
   ${ver}<button class="btn pri" type="submit" style="min-height:54px;font-size:17px">Entrar</button></form>
   <div style="border-top:1px solid var(--sep);padding-top:12px;text-align:center" class="small muted">¿No tienes cuenta? <button class="link small" data-a="modoLogin" data-k="crear">Crear una</button></div>${proyecto}`)}
A.modoLogin=d=>{const e=($('#lg-e')||{}).value||'';renderLogin('',d.k,e)};
const errAuth=m=>/already|registered|exists/i.test(m)?'Ese correo ya tiene una cuenta. Pulsa «Entrar aquí».':/invalid.*email|email.*invalid/i.test(m)?'Ese correo no parece correcto. Revísalo.':/password/i.test(m)&&/short|least|weak/i.test(m)?'La contraseña es demasiado corta: mínimo 6 caracteres.':/rate|many/i.test(m)?'Demasiados intentos. Espera un minuto y vuelve a probar.':m;
A.login=async()=>{const e=$('#lg-e').value.trim();const {error}=await S.sb.auth.signInWithPassword({email:e,password:$('#lg-p').value});
  if(error){toast(/Invalid/i.test(error.message)?'Correo o contraseña incorrectos.':/confirm/i.test(error.message)?'Falta confirmar el correo: abre el correo que te hemos enviado y pulsa el enlace.':errAuth(error.message));return}lsSet('cc-ya-cuenta','1');boot()};
A.signup=async()=>{const e=$('#lg-e').value.trim(),p=$('#lg-p').value,p2=$('#lg-p2').value;
  if(!e){toast('Escribe tu correo.');return}if(p.length<6){toast('La contraseña tiene que tener 6 caracteres o más.');return}
  if(p!==p2){toast('Las dos contraseñas no coinciden. Vuelve a escribirlas.');$('#lg-p2').value='';$('#lg-p2').focus();return}
  const {data,error}=await S.sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});if(error){toast(errAuth(error.message));return}
  lsSet('cc-ya-cuenta','1');
  if(!data.session){renderLogin('Cuenta creada. Te hemos enviado un correo: ábrelo y pulsa el enlace para confirmarla. Después vuelve aquí y entra.','entrar',e);return}boot()};
function renderHogar(){welcome(`<div class="logo-app"><img src="icon-192.png" alt=""></div><div><h1 style="margin:0;font-size:26px">Tu casa</h1><p class="muted small" style="margin:4px 0 0">Toda la familia comparte una sola casa en la app.</p></div>
  <div class="fld"><label for="h-me">Tu nombre</label><input class="inp" id="h-me" placeholder="Ej. Irene" autocomplete="given-name"></div>
  <div class="glass pad" style="display:grid;gap:10px;border:2px solid var(--red);background:var(--red-card)"><b style="color:var(--red);font-size:17px">¿Alguien de tu casa ya usa la app?</b><span class="small">Pídele el <b>código de 6 letras</b> (está en su pestaña <b>Más</b>) y únete. <b>No crees una casa nueva.</b></span>
   <input class="inp code" id="h-c" placeholder="CÓDIGO" maxlength="6" autocapitalize="characters" style="text-transform:uppercase;font-size:20px;text-align:center"><button class="btn pri" data-a="unirse">Unirme a su casa</button></div>
  <div class="row small muted" style="justify-content:center">o, si eres la primera persona de tu casa</div>
  <div class="glass pad" style="display:grid;gap:10px"><b>Crear una casa nueva</b><span class="small muted">Después tendrás que pasar el código al resto de la familia.</span><input class="inp" id="h-n" placeholder="Nombre de la casa (ej. Casa)"><button class="btn gl" data-a="crearHogar">Crear casa nueva</button></div>
  <button class="link small" data-a="logout" style="align-self:center">Cerrar sesión</button>`)}
A.crearHogar=async()=>{const me=cap($('#h-me').value);if(!me){toast('Escribe tu nombre.');return}const {error}=await S.sb.rpc('crear_hogar',{p_nombre:$('#h-n').value.trim()||'Casa',p_mi_nombre:me,p_color:COLORES[0]});if(error){toast(error.message);return}boot()};
A.unirse=async()=>{const me=cap($('#h-me').value),c=$('#h-c').value.trim();if(!me||c.length<4){toast('Escribe tu nombre y el código.');return}const {error}=await S.sb.rpc('unirse_hogar',{p_codigo:c,p_mi_nombre:me,p_color:COLORES[1]});if(error){toast(error.message.includes('Código')?'Ese código no existe.':error.message);return}boot()};

/* ============ ARRANQUE ============ */
async function boot(){S.ready=false;cargarImagenesGH();cargarReferencia();cargarOfertas();cargarRecetasNuevas();const fijo=!!(CONFIG.supabaseUrl&&CONFIG.supabaseAnonKey);const mode=fijo?'supa':(lsGet('cc-mode','')||(getConfig()?'supa':''));
  if(!mode){renderSetup();return}
  if(mode==='supa'&&(!getConfig()||!window.supabase)){if(!window.supabase){welcome('<p>No se pudo cargar Supabase. Revisa la conexión a internet y recarga.</p>');return}renderSetup();return}
  S.mode=mode;B=mode==='supa'?Supa:Local;
  welcome('<div class="row"><span class="spin"></span><span>Cargando…</span></div>');
  try{const st=await B.init();if(st==='login'){renderLogin();return}if(st==='hogar'){renderHogar();return}}
  catch(e){console.error(e);welcome(`<h2 style="margin:0">No se pudo conectar</h2><p class="muted small">${esc(e.message||e)}</p><p class="small">¿Has ejecutado el archivo <b>schema.sql</b> en Supabase?</p><button class="btn pri" data-a="reintentar">Reintentar</button><button class="btn gl" data-a="irSetup">Cambiar de proyecto</button>`);return}
  S.ready=true;render()}
A.reintentar=()=>boot();
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&S.ready&&S.mode==='supa'){try{await B.reload();paint()}catch(e){}}});
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
